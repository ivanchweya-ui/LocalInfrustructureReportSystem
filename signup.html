<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrator Sign-up Request</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>Local Infrastructure Issue Reporter</h1><nav><a href="report.html">Home</a><a href="login.html">Staff Login</a></nav></header>
<main class="narrow card"><h2>Sub-County Administrator Sign-up</h2><p class="hint">Requests are reviewed by the system administrator for this installation. You cannot log in until approved.</p>
<form id="f"><label>Full name<input name="full_name" autocomplete="name" maxlength="100" required></label><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="50" required></label><label>Email<input type="email" name="email" autocomplete="email" maxlength="100" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input type="password" name="password_confirmation" autocomplete="new-password" minlength="12" required></label><button type="submit">Request Account</button></form><div id="msg"></div></main>
<script src="js/common.js"></script><script src="js/signup.js"></script></body></html>
