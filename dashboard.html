<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>Local Infrastructure Issue Reporter</h1><nav><a class="on" href="dashboard.html">Dashboard</a><span id="who"></span><button type="button" onclick="logout()">Log out</button></nav></header>
<main><div id="stats" class="stats"></div>
<div class="card row"><label>Category<select id="fc"></select></label><label>Area<select id="fa"></select></label><label>Status<select id="fs"><option value="">All statuses</option><option>Submitted</option><option>Under Review</option><option>In Progress</option><option>Resolved</option></select></label><div><button id="apply" type="button">Apply</button><button id="reset" type="button" class="alt">Reset</button></div></div>
<table><thead><tr><th>Ref code</th><th>Category</th><th>Area</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table>
<div class="card"><h3>Add an area (ward registration)</h3><form id="af" class="row"><label>Area name<input name="area_name"></label><label>Region<input name="region"></label><label>Latitude (optional)<input name="latitude"></label><label>Longitude (optional)<input name="longitude"></label><div><button type="submit">Add area</button></div></form><div id="amsg"></div></div></main>
<script src="js/common.js"></script><script src="js/dashboard.js"></script></body></html>
