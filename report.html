<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1b3a5c"><link rel="manifest" href="manifest.json"><title>Report an Issue</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="brand"><h1>Local Infrastructure Issue Reporter</h1><section class="app-share" aria-label="Install or share this app"><div id="appQr" role="img"></div><div><strong>Install or share</strong><p id="appShareMessage" class="hint"></p><button id="installApp" type="button" hidden>Install app</button></div></section></div><nav><a class="on" href="report.html">Report an Issue</a><a href="status.html">Check Status</a><a href="login.html">Staff Login</a></nav></header>
<main><h2>Report an Issue</h2><p class="hint">Tell us about a problem in your area. No login needed. You will receive a reference code after submitting; keep it private.</p>
<form id="f" novalidate>
<label>Category *<select id="category_id" name="category_id"></select></label>
<label>Area *<select id="area_id" name="area_id"></select></label>
<label>Landmark / street (optional)<input id="landmark" name="landmark" maxlength="150" placeholder="e.g. Near the mosque, Mwiki Road"></label>
<label>Description *<textarea id="description" name="description" rows="4" placeholder="Describe the problem..."></textarea></label>
<label>Photo (optional, JPG or PNG up to 2MB)<input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png"></label>
<label>Optional contact method<select id="contact_method" name="contact_method"><option value="">Do not provide contact details</option><option value="email" disabled>Email</option><option value="phone" disabled>Phone / SMS</option><option value="whatsapp" disabled>WhatsApp</option></select></label>
<p id="notificationHint" class="hint" aria-live="polite">Checking available notification methods...</p>
<label>Optional email address or phone number<input id="contact_detail" name="contact_detail" placeholder="Only needed if you choose a contact method"></label>
<button type="submit">Submit Report</button><button type="reset" class="alt">Clear form</button></form>
<div id="msg"></div><div id="result" class="card" hidden></div></main>
<script src="js/vendor/qrcode.min.js"></script><script src="js/common.js"></script><script src="js/report.js"></script></body></html>
