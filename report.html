<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Report an Issue</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>Local Infrastructure Issue Reporter</h1><nav><a class="on" href="report.html">Report an Issue</a><a href="status.html">Check Status</a><a href="login.html">Staff Login</a></nav></header>
<main><h2>Report an Issue</h2><p id="instance" class="hint"></p><p class="hint">Tell us about a problem in your area. No login needed.</p>
<form id="f" novalidate>
<label>Category *<select id="category_id" name="category_id"></select></label>
<label>Area *<select id="area_id" name="area_id"></select></label>
<label>Landmark / street (optional)<input id="landmark" name="landmark" maxlength="150" placeholder="e.g. Near the mosque, Mwiki Road"></label>
<label>Description *<textarea id="description" name="description" rows="4" placeholder="Describe the problem..."></textarea></label>
<label>Photo (optional, JPG or PNG up to 2MB)<input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png"></label>
<label>Optional contact method (automatic messages are not available)<select id="contact_method" name="contact_method"><option value="">Do not provide contact details</option><option value="email">Email</option><option value="phone">Phone / SMS</option><option value="whatsapp">WhatsApp</option></select></label>
<label>Optional email address or phone number<input id="contact_detail" name="contact_detail" placeholder="Only needed if you choose a contact method"></label>
<button type="submit">Submit Report</button><button type="reset" class="alt">Clear form</button></form>
<div id="msg"></div><div id="result" class="card" hidden></div></main>
<script src="js/common.js"></script><script src="js/report.js"></script></body></html>
